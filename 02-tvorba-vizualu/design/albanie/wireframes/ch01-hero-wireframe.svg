<svg viewBox="0 0 900 1000" xmlns="http://www.w3.org/2000/svg" role="img" width="900" height="1000">
<title>Wireframe hero strany kapitoly 1 s vyznačenými bezpečnými zónami</title>
<desc>Opravená kostra hero strany: pevný rámeček pro fotku nahoře, text-safe zóna pro úvodní odstavec s maximální délkou textu, a dva boxy (insider tip, pozor) s fixním odsazením od textové zóny, které se nikdy nepřekryjí bez ohledu na délku textu.</desc>

<rect x="0" y="0" width="900" height="1000" fill="#FFFDF9"/>

<rect x="60" y="30" width="780" height="940" fill="#F3ECE0" stroke="#3A2E27" stroke-width="1.5"/>

<rect x="60" y="30" width="780" height="300" fill="#EAE2D2" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="8 6"/>
<line x1="60" y1="30" x2="840" y2="330" stroke="#B4B2A9" stroke-width="1"/>
<line x1="840" y1="30" x2="60" y2="330" stroke="#B4B2A9" stroke-width="1"/>
<rect x="330" y="150" width="240" height="60" fill="#F3ECE0" stroke="#5F5E5A" stroke-width="1"/>
<text x="450" y="175" text-anchor="middle" font-size="15" font-weight="500" fill="#3A2E27">foto – pevný rámeček</text>
<text x="450" y="195" text-anchor="middle" font-size="13" fill="#5F5E5A">1600×960 · místopisná nebo náladová</text>

<rect x="100" y="360" width="700" height="30" fill="none" stroke="#C1502E" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="450" y="381" text-anchor="middle" font-size="20" font-weight="500" fill="#C1502E" font-family="Georgia, serif">Nadpis kapitoly</text>

<rect x="100" y="410" width="700" height="130" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 5"/>
<line x1="115" y1="435" x2="785" y2="435" stroke="#3A2E27" stroke-width="6" opacity="0.35"/>
<line x1="115" y1="460" x2="785" y2="460" stroke="#3A2E27" stroke-width="6" opacity="0.35"/>
<line x1="115" y1="485" x2="785" y2="485" stroke="#3A2E27" stroke-width="6" opacity="0.35"/>
<line x1="115" y1="510" x2="560" y2="510" stroke="#3A2E27" stroke-width="6" opacity="0.35"/>
<text x="115" y="555" font-size="13" fill="#5F5E5A">text-safe zóna úvodu – max. cca 420 znaků při 18 px, nikdy víc</text>

<line x1="100" y1="540" x2="800" y2="540" stroke="#C1502E" stroke-width="2"/>
<text x="450" y="575" text-anchor="middle" font-size="12" fill="#C1502E" font-weight="500">pevná rezerva 40 px – nezávisí na délce textu nahoře</text>

<rect x="100" y="600" width="330" height="260" rx="20" fill="#6B7A3A"/>
<text x="265" y="645" text-anchor="middle" font-size="17" font-weight="500" fill="#EAF3DE" font-family="Georgia, serif">Insider tip</text>
<line x1="150" y1="660" x2="380" y2="660" stroke="#EAF3DE" stroke-width="1"/>
<line x1="125" y1="700" x2="405" y2="700" stroke="#EAF3DE" stroke-width="5" opacity="0.5"/>
<line x1="125" y1="720" x2="405" y2="720" stroke="#EAF3DE" stroke-width="5" opacity="0.5"/>
<line x1="125" y1="740" x2="405" y2="740" stroke="#EAF3DE" stroke-width="5" opacity="0.5"/>
<line x1="125" y1="760" x2="330" y2="760" stroke="#EAF3DE" stroke-width="5" opacity="0.5"/>

<rect x="470" y="600" width="330" height="260" rx="20" fill="#C1502E"/>
<text x="635" y="645" text-anchor="middle" font-size="17" font-weight="500" fill="#FAECE7" font-family="Georgia, serif">Pozor</text>
<line x1="495" y1="700" x2="775" y2="700" stroke="#FAECE7" stroke-width="5" opacity="0.5"/>
<line x1="495" y1="720" x2="775" y2="720" stroke="#FAECE7" stroke-width="5" opacity="0.5"/>
<line x1="495" y1="740" x2="775" y2="740" stroke="#FAECE7" stroke-width="5" opacity="0.5"/>
<line x1="495" y1="760" x2="700" y2="760" stroke="#FAECE7" stroke-width="5" opacity="0.5"/>

<text x="450" y="900" text-anchor="middle" font-size="13" fill="#5F5E5A">oba boxy: fixní výška a odsazení – i kdyby text výš dosáhl maxima, sem nezasáhne</text>

<text x="450" y="945" text-anchor="middle" font-size="13" fill="#3A2E27" font-weight="500">číslo strany · název produktu</text>

</svg>
