    {
      "id": "guide-01-03-two-equal-sections",
      "kind": "guide",
      "section": "01",
      "order": 5,
      "layout": "two-equal-sections",
      "content_contract": "### Zdraví a očkování\n\nEgypt vyhlásila Světová zdravotnická organizace v roce 2024 za zemi **bez malárie** a americké CDC\nantimalarickou profylaxi nedoporučuje — přesto se vyplatí standardní opatření proti hmyzu\nnepodcenit. Z doporučených očkování se řeší běžná přeočkování, hepatitida A a B a tyfus; pokud máš\nv plánu dobrodružnější program v poušti nebo kontakt se zvířaty, zvaž i vzteklinu. Tohle je\ninformační přehled, ne lékařské doporučení — zkonzultuj to s očkovacím centrem před cestou.\n\n### Kdy jet\n\nRok se dělí na chladnější období **říjen–duben** (zhruba 20–28 °C) a horké **květen–září**.\nNejvyváženější měsíce, kdy je teplo, ale ne vrchol veder, jsou **polovina března až duben** a\n**polovina října až listopad** — hodí se jak na moře, tak na celodenní výlety do pouště. Zima\n(prosinec–únor) je naopak nejpříjemnější právě na pouštní výlety, ale na vodní aktivity už\nchladnější.",
