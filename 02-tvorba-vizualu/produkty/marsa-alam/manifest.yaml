      "content_contract": "Na rozdíl od jiných destinací v řadě, kde si jídlo řešíš sám, tady drtivá většina návštěvníků jí\npřes all-inclusive balíček. Tahle kapitola ti řekne, co od toho čekat a kdy se vyplatí resort na\nchvíli opustit.\n\n### Realita all-inclusive\n\nAll-inclusive v Marsa Alam obvykle znamená bufetová jídla v hotelové restauraci a nápoje (včetně\nalkoholu) v rámci resortu — typicky ale jen u hotelového baru nebo restaurace, ne kdekoliv mimo\nareál. Kvalita i šíře nabídky se mezi resorty hodně liší, stejně jako to, jestli je pitná voda z\nkohoutku, nebo jen balená. Než vyrazíš, ověř si u konkrétního hotelu, co přesně balíček zahrnuje —\nbrožury cestovek bývají v tomhle bodě dost obecné.\n\nZákladní pravidlo pro pitnou vodu: v celém Egyptě se doporučuje pít **balenou vodu**, ne vodu z\nkohoutku, a to i v resortu. Vezmi to v potaz i u ledu do nápojů mimo hotel.\n\n### Kdy a jak mimo resort\n\nI když jedeš přes all-inclusive, občasný výlet na jídlo mimo hotel dává smysl hlavně v **Port\nGhalib**, kde je marína plná restaurací a je to jediná oblast, kam se z resortu dostaneš pěšky\n(viz kapitola Výběr oblasti a doprava). V ostatních částech pobřeží je restaurace mimo hotel spíš\nvýjimka než reálná možnost — buď žádná v docházkové vzdálenosti není, nebo je potřeba domluvený\ntransfer.\n\nPokud se chystáš na celodenní výlet (potápění, šnorchlování, poušť), počítej s tím, že jídlo bývá\nsoučástí balíčku výletu — u organizovaných tras to ověř předem, ať víš, jestli si máš něco vzít s\nsebou.",
