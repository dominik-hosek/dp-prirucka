      "id": "guide-01-00-section-cover",
      "kind": "guide",
      "section": "01",
      "order": 2,
      "layout": "section-cover",
      "content_contract": "## Praktické základy\n\nBarcelona je logisticky pohodlná destinace — ale zároveň město, které se právě mění, a část těch změn\nti sáhne rovnou do peněženky. Tahle kapitola řeší čtyři věci, které se rozhodují ještě doma: kdy jet,\njak se dostat z letiště do centra, s jakou daní počítat navíc a jak se nestat jedním z těch, komu\nv metru zmizí peněženka.",
