      "layout": "section-cover",
      "content_contract": "## Off the beaten path\n\nBarcelona je jedno z nejpopsanějších měst Evropy, takže „místa mimo trasu\" tu nejsou tajemství —\njsou to místa, u kterých většina návštěvníků nezná pravidla a přijede ve špatnou hodinu. Tahle\nkapitola je proto míň o tom, kam jít, a víc o tom, **kdy tam jít, aby to mělo smysl**.",
