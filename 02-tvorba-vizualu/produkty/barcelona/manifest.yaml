      "order": 31,
      "layout": "timeline-itinerary",
      "content_contract": "### Tři itineráře\n\nČasy dopravy a ceny jízdenek najdeš v kapitole Doprava po městě a do okolí, ceny vstupů výš.\nItineráře počítají s tím, že vstupenky na časové sloty máš koupené předem.\n\n**Dva dny — první návštěva**\n\n- *Den 1, dopoledne:* Sagrada Família (pokud je otevřená a máš slot), potom pěšky pět minut na\n\nRecinte Modernista de Sant Pau.\n\n- *Den 1, oběd:* menú del día mimo hlavní třídy (viz kapitola Jídlo a pití), ideálně kolem 14:00.\n- *Den 1, odpoledne:* Park Güell na rezervovaný slot. Počítej s tím, že se odsud nedá odejít\n\na vrátit.\n\n- *Den 2, dopoledne:* Eixample pěšky — Casa Batlló a La Pedrera.\n- *Den 2, odpoledne:* Gotická čtvrť a Museu Picasso, večer Rambla de Catalunya místo La Rambla.\n\n**Tři dny — s výletem**\n\nPrvní dva dny jako výše, třetí den ven z města:\n\n- **Sitges**, pokud chceš spontánnost — R2 Sud jede 30–40 minut, spoje po 15–20 minutách, jízdenka\n\nod zhruba 6 EUR.\n\n- **Montserrat**, pokud chceš velký výlet — R5 z Plaça Espanya plus Cremallera nebo lanovka Aeri.\n\nVyžaduje předem vyřešené jízdenky a celý den; à la carte orientačně 36,80 EUR včetně vstupu do\n  baziliky.\n\n- **Tarragona** je hodinu až hodinu a půl vlakem R14, **Girona a Figueres** jsou dostupné\n\npříměstskými vlaky Rodalies (cenu si ověř, dostupný údaj byl jen v dolarech).\n\n**Levný den, který za nic nestojí míň**\n\nNaplánuj si ho na **první neděli v měsíci** a vyjde takhle:\n\n- Dopoledne **MNAC zdarma** (bez rezervace) nebo **Museu Picasso zdarma** — ale u Picassa musíš mít\n\nslot zarezervovaný už čtyři dny předem.\n\n- Odpoledne **Parc del Laberint d'Horta**, který je zdarma každou středu a neděli (viz kapitola\n\nOff the beaten path) — pozor na denní strop 750 návštěvníků.\n\n- Podvečer **Bunkers del Carmel**, kde se za panorama neplatí nikdy. **Ale zavírá se v 19:30 v létě",
