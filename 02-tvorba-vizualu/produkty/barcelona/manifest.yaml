    {
      "id": "guide-06-01-timeline-itinerary",
      "kind": "guide",
      "section": "06",
      "order": 35,
      "layout": "timeline-itinerary",
      "content_contract": "### Bunkers del Carmel — a proč tam nejdeš na západ slunce\n\nProtiletadlové bunkry ze španělské občanské války na kopci nad městem. **Panorama na 360 stupňů,\nvstup zdarma** a z každé autobusové zastávky závěrečný výšlap do kopce — pohodlná obuv je nutnost.\n\nA teď to podstatné. „Jdi na Bunkers na sunset\" je jedna z nejopakovanějších rad v cestovatelském\nobsahu o Barceloně. **V létě je to rada, která nefunguje.**\n\nOd 2. května 2023 je místo v noci zavřené. Otevírací doba je **9:00–19:30 v létě a 9:00–17:30\nv zimě**. Není to doporučení, ale pravidlo, které město zavedlo kvůli přetížení turisty a obtěžování\nmístních obyvatel — hluk a noční večírky se staly vážným problémem pro lidi, kteří tam bydlí.\nObyvatelé si i nadále stěžují na přeplněnou MHD, skupiny pijící na veřejnosti a hlučné večírky\nnavzdory zavírací době. Pravidla platí i v roce 2026.\n\nBer to tedy jako dopolední nebo odpolední zastávku. Kdy přesně se přepíná mezi letním a zimním\nrežimem, se nám doložit nepodařilo — pokud jedeš na jaře nebo na podzim, ověř si to.\n\nKonkrétní autobusovou linku ani délku výšlapu tu neuvádíme, protože se je nepodařilo spolehlivě\ndoložit. Ověř si spojení až na místě.",
